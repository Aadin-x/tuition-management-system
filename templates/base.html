<!DOCTYPE html>
<html>
<head>
    <title>Tuition Management System - developed by aadin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">Tuition Management System</a>
            <div class="navbar-nav">
                {% if session.get('admin') %}
                    <a class="nav-link" href="/dashboard">Dashboard</a>
                    <a class="nav-link" href="/students">Students</a>
                    <a class="nav-link" href="/add">Add Student</a>
                    <a class="nav-link" href="/logout">Logout ({{ session['admin'] }})</a>
                {% else %}
                    <a class="nav-link" href="/login">Admin Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <footer class="text-center text-muted mt-5 mb-3">
        Developed by Aadin
    </footer>
</body>
</html>
